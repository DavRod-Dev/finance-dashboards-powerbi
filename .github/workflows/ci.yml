name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow pytest
      # The export script needs the sibling repos' databases and is run
      # locally. CI validates what it produced: every Parquet table in
      # data/ has the grain, keys and relationships the README promises.
      - run: pytest
